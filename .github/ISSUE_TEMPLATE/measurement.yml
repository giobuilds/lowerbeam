name: GPU/model measurement
description: Share real speed and VRAM figures from your GPU. These help calibrate Lowerbeam's estimates.
labels: ["measurement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Real measurements from cards and models we haven't tested are some of the most useful things you can share.
  - type: input
    id: version
    attributes:
      label: Lowerbeam version
      placeholder: "0.15.0"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and VRAM
      placeholder: "RX 6600, 8 GB"
    validations:
      required: true
  - type: input
    id: llamacpp
    attributes:
      label: llama.cpp build and backend
      placeholder: "Official download, b6500 Vulkan"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and quantisation
      placeholder: "Qwen3-8B Q4_K_M"
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context size
      placeholder: "16384"
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Launch settings
      description: GPU layers, KV cache type, flash attention, batch size and any other flags you changed.
      render: text
    validations:
      required: true
  - type: input
    id: speed
    attributes:
      label: Tokens per second
      description: Prompt processing and generation, if you have both.
      placeholder: "pp 450 t/s, tg 38 t/s"
    validations:
      required: true
  - type: input
    id: vram
    attributes:
      label: VRAM used (if you know it)
      placeholder: "7.1 GB"
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Was it measured inside Lowerbeam or with llama-bench? Did it differ from Lowerbeam's estimate?
