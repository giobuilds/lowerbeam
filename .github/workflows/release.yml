# A release: push an annotated tag `vX.Y.Z` on main's merge commit, matching
# package.json's version and a section in CHANGELOG.md (`npm run
# release:prepare` makes both). This checks all of that, builds the AppImage
# and RPM, signs SHA256SUMS over them and latest-linux.yml, and only then
# publishes the GitHub release — which is what a running AppImage looks for
# (src/main/updater.ts). The notes are the changelog section, then the pull
# requests merged since the previous release. The signature is made by the
# key in release-signing-key.asc; its private half is the GPG_PRIVATE_KEY
# secret and the passphrase is GPG_PASSPHRASE. A tag with either secret
# missing is not published.
#
# On a pull request that touches packaging, the same job builds without
# publishing and keeps the packages as workflow artifacts, so the release
# path is exercised before a tag ever depends on it.
#
# workflow_dispatch runs only the signing rehearsal: a throwaway key, dummy
# release files, sign, verify, and no GitHub release. The tag job never sets
# GPG_FINGERPRINT, so it still signs with the key in the repository.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - electron-builder.yml
      - package.json
      - package-lock.json
      - CHANGELOG.md
      - scripts/release.mjs
      - scripts/checksums.mjs
      - release-signing-key.asc

jobs:
  release:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Creating the release and uploading its files.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, to check the tag is on main's own line.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: The tag is a release of main, of this version, with its notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          # Annotated: it records who released, when and why; a lightweight tag is just a pointer.
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq .object.type)" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag; use git tag -a ${GITHUB_REF_NAME} -m \"Lowerbeam ${version}\""
            exit 1
          fi
          # On main's first-parent line: the merge commit, not a commit from the branch it merged.
          if ! git rev-list --first-parent origin/main | grep -qx "${GITHUB_SHA}"; then
            echo "::error::${GITHUB_REF_NAME} is not on main's own history; tag the merge commit on main"
            exit 1
          fi
          node scripts/release.mjs notes "${version}" > /dev/null

      # The same checks as CI: nothing is released that would not pass them.
      # rpm is for electron-builder's RPM target; bubblewrap for the sandbox
      # suites; gnupg signs the checksums.
      - name: Install rpm, bubblewrap and gnupg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm bubblewrap gnupg
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

      # Built either way, and not published yet: a tag signs the checksums
      # first, and only then creates the release. Publishing before the
      # signature exists would leave a release that cannot be checked.
      - name: Package
        run: npx electron-builder --linux --publish never

      - name: The signing key is available
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_PASSPHRASE" ]; then
            echo "::error::GPG_PRIVATE_KEY and GPG_PASSPHRASE must be set before a release is published"
            exit 1
          fi

      - name: Sign the checksums
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          umask 077
          gnupg=$(mktemp -d)
          chmod 700 "$gnupg"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --homedir "$gnupg" --import
          GNUPGHOME="$gnupg" node scripts/checksums.mjs dist --sign
          rm -rf "$gnupg"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            node scripts/release.mjs notes "${version}"
            echo
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${GITHUB_REF_NAME}" --jq .body
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" \
            dist/Lowerbeam.AppImage \
            dist/*.rpm \
            dist/latest-linux.yml \
            dist/SHA256SUMS \
            dist/SHA256SUMS.asc \
            --title "Lowerbeam ${version}" \
            --notes-file notes.md

      - name: Checksums for the dry run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/checksums.mjs dist

      # What the notes would say for the version in package.json, so a PR that
      # breaks the changelog finds out before a tag does.
      - name: Release notes, as they would be
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/release.mjs notes "$(node -p "require('./package.json').version")"

      - name: Keep the packages from a dry run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.AppImage
            dist/*.rpm
            dist/latest-linux.yml
            dist/SHA256SUMS
          retention-days: 7

  # The tag steps above are the first time the real key would sign anything.
  # This job runs that same sign-and-verify command with a key created here
  # and deleted here. It does not read GPG_PRIVATE_KEY or create a release.
  signing-rehearsal:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install gnupg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnupg

      - name: Sign and verify with a throwaway key
        run: |
          umask 077
          gnupg=$(mktemp -d)
          chmod 700 "$gnupg"
          passphrase=$(openssl rand -base64 24 | tr -d '\n')
          printf '%s' "$passphrase" | gpg --homedir "$gnupg" --batch --pinentry-mode loopback --passphrase-fd 0 \
            --quick-gen-key "Lowerbeam signing test <signing-test@example.invalid>" ed25519 sign 1d
          fingerprint=$(gpg --homedir "$gnupg" --batch --with-colons --list-keys | awk -F: '/^fpr:/ {print $10; exit}')
          public=$(gpg --homedir "$gnupg" --armor --export "$fingerprint")
          mkdir -p dist
          printf 'appimage\n' > dist/Lowerbeam.AppImage
          printf 'rpm\n' > dist/lowerbeam-test.x86_64.rpm
          printf 'version: 0.0.0\n' > dist/latest-linux.yml
          GNUPGHOME="$gnupg" \
            GPG_PASSPHRASE="$passphrase" \
            GPG_FINGERPRINT="$fingerprint" \
            GPG_PUBLIC_KEY="$public" \
            node scripts/checksums.mjs dist --sign
          test -f dist/SHA256SUMS.asc
          rm -rf "$gnupg" dist
