# Every push to main and every pull request: types, the unit tier, a build,
# and an audit of what ships, on the oldest Node the tooling supports and on
# the one it is developed on. Weekly as well, so a new advisory surfaces
# without waiting for a change. Integration suites need a llama.cpp binary, a
# model or the network, and stay manual (`npm run test:all`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The floor is package.json's engines field: Electron 44's tooling and Vite 7 need 22.12.
        node: ['22.12', '24']
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Nothing here launches Electron; the build and the suites do not need its binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The sandbox suites run commands in bubblewrap. Ubuntu's runners ship
      # with unprivileged user namespaces restricted by AppArmor, which
      # bubblewrap needs; lifting that here means those suites run for real
      # instead of failing or being skipped.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      # Both trees: --omit=dev alone never sees Electron, which ships. See the script for what blocks.
      - run: npm run audit:deps
        if: matrix.node == '24'
