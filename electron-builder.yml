appId: dev.lowerbeam.app
productName: Lowerbeam
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
linux:
  icon: resources/icon.png
  # Without this, desktop environments do not associate running windows with the
  # .desktop entry, so the app shows a generic icon in the dock and switcher.
  synopsis: Control panel for llama.cpp
  desktop:
    entry:
      Name: Lowerbeam
  target:
    - AppImage
    - rpm
  category: Development
  description: >-
    Launch, monitor and tune llama-server without a terminal: pick a GGUF, see
    what fits in VRAM, and chat with it.
# Releases, and where a running copy looks for the next one: electron-builder
# writes latest-linux.yml beside the AppImage and RPM, and app-update.yml into
# the package, which electron-updater reads (src/main/updater.ts).
publish:
  provider: github
  owner: giobuilds
  repo: lowerbeam
  releaseType: release
