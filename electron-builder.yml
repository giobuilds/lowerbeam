appId: dev.lowerbeam.app
productName: Lowerbeam
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
# The project "Measure this model" runs on, beside the app rather than in the
# asar: a coding run copies it, and its tests run with the user's node.
extraResources:
  - from: resources/measure/corpus
    to: measure/corpus
  # Licence notices, including the tree-sitter grammars' MIT upstream.
  - from: resources/NOTICES
    to: NOTICES
  # Tree-sitter, so a packaged app can build a repo map offline.
  # The wasm package is a devDependency (it depends on itself, and the
  # production walk runs out of memory on that cycle). These copies are
  # what the packaged app loads.
  - from: node_modules/web-tree-sitter/tree-sitter.wasm
    to: tree-sitter/tree-sitter.wasm
  - from: node_modules/tree-sitter-wasms/out/tree-sitter-typescript.wasm
    to: tree-sitter/grammars/tree-sitter-typescript.wasm
  - from: node_modules/tree-sitter-wasms/out/tree-sitter-tsx.wasm
    to: tree-sitter/grammars/tree-sitter-tsx.wasm
  - from: node_modules/tree-sitter-wasms/out/tree-sitter-javascript.wasm
    to: tree-sitter/grammars/tree-sitter-javascript.wasm
  - from: node_modules/tree-sitter-wasms/out/tree-sitter-python.wasm
    to: tree-sitter/grammars/tree-sitter-python.wasm
  - from: node_modules/tree-sitter-wasms/out/tree-sitter-c.wasm
    to: tree-sitter/grammars/tree-sitter-c.wasm
  - from: node_modules/tree-sitter-wasms/out/tree-sitter-rust.wasm
    to: tree-sitter/grammars/tree-sitter-rust.wasm
  - from: node_modules/tree-sitter-wasms/out/tree-sitter-go.wasm
    to: tree-sitter/grammars/tree-sitter-go.wasm
linux:
  maintainer: giobuilds <57153417+giobuilds@users.noreply.github.com>
  icon: resources/icon.png
  synopsis: Lowerbeam is the local AI workbench for small GPUs
  desktop:
    entry:
      Name: Lowerbeam
  target:
    - AppImage
    - rpm
  category: Development
# One name for every version, so the file a shortcut points at is the file an
# update replaces: electron-updater overwrites an AppImage in place when its
# name carries no version, and renames it (breaking the shortcut) when it does.
appImage:
  artifactName: ${productName}.${ext}
  description: >-
    Lowerbeam helps you get the most out of local models on an 8 GB card.
    It sets up the official llama.cpp for you, or uses the one you already have,
    and gives you one desktop app to pick a model that fits, 
    launch it well, and actually use it.
# Releases, and where a running copy looks for the next one: electron-builder
# writes latest-linux.yml beside the AppImage and RPM, and app-update.yml into
# the package, which electron-updater reads (src/main/updater.ts).
publish:
  provider: github
  owner: giobuilds
  repo: lowerbeam
  releaseType: release
